name: GLaDOS Auto Checkin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: keepalive-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Keep scheduled workflows active
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          last_commit=$(git log -1 --format=%ct)
          now=$(date +%s)
          if (( now - last_commit >= 45 * 24 * 60 * 60 )); then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit --allow-empty -m "chore: keep scheduled workflows active"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          else
            echo "Recent repository activity; no keepalive commit needed."
          fi

  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: glados-checkin-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install "requests==2.32.3" --no-cache-dir

      - name: Run checkin
        run: python checkin.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COOKIES: ${{ secrets.COOKIES || vars.COOKIES }}
          GLADOS_SITE: ${{ vars.GLADOS_SITE }}
          SENDKEY: ${{ secrets.SENDKEY }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          WECOM_BOT_WEBHOOK: ${{ secrets.WECOM_BOT_WEBHOOK }}
          YUNHU_TOKEN: ${{ secrets.YUNHU_TOKEN }}
          YUNHU_RECV_ID: ${{ secrets.YUNHU_RECV_ID }}
          YUNHU_RECV_TYPE: ${{ secrets.YUNHU_RECV_TYPE }}
          EXCHANGE_PLAN: ${{ secrets.EXCHANGE_PLAN }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
